[package]
name = "openslot"
version = "0.2.0"
edition = "2024"
description = "Openslot: independent cross-platform client compatible with VarAC, built on the VARA modem TCP interface"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
base64 = "0.22"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
eframe = "0.30"
# (serde: the station sends its screen to remotes, and they send back their input)
egui = { version = "0.30", features = ["serde"] }
egui_extras = { version = "0.30", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
ab_glyph = "0.2"
notify-rust = "4"
open = "5"
rfd = "0.15"
serialport = { version = "4", features = ["usbportinfo-interface"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Optional encryption and signing (src/varac/secure.rs); already here through rustls
ring = "0.17"
webpki-roots = "1"
mail-parser = "1.0.0"
# Remote mode: the WebSocket handshake, and the password's proof
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# Remote mode: playing a station's audio (off by default here: needs ALSA's headers on Linux)
cpal = { version = "0.15.3", optional = true }

[features]
remote-audio = ["dep:cpal"]

[dev-dependencies]
tokio-test = "0.4"
# Renders windows in tests (cargo test window_shots -- --ignored writes screenshots)
egui_kittest = { version = "0.30", features = ["wgpu"] }

# (egui_kittest's wgpu has no GPU backend of its own on a Mac)
[target.'cfg(target_os = "macos")'.dev-dependencies]
wgpu = { version = "23", default-features = false, features = ["metal", "wgsl"] }
